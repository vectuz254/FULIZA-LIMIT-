<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Portal Login – TOPJOBSEEKERS</title>
<link rel="stylesheet" href="style.css" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
<style>
  body { background: linear-gradient(135deg, #0A1628 0%, #1E3A5F 100%); min-height: 100vh; }
  .auth-wrap { max-width: 460px; margin: 0 auto; padding: 60px 24px; }
  .auth-card { background: #fff; border-radius: var(--radius-lg); padding: 36px; box-shadow: var(--shadow-lg); }
  .auth-tabs { display: flex; gap: 8px; margin-bottom: 24px; background: var(--blue-pale); border-radius: 10px; padding: 4px; }
  .auth-tab { flex: 1; text-align: center; padding: 10px; border-radius: 8px; font-weight: 600; font-size: 14px; cursor: pointer; color: var(--text-muted); }
  .auth-tab.active { background: var(--blue); color: #fff; }
  .auth-form { display: none; }
  .auth-form.active { display: block; }
  .role-select { display: flex; gap: 10px; margin-bottom: 18px; }
  .role-option { flex: 1; border: 1.5px solid var(--border); border-radius: 10px; padding: 14px 10px; text-align: center; cursor: pointer; font-size: 13px; font-weight: 600; color: var(--text-muted); }
  .role-option.selected { border-color: var(--blue); background: var(--blue-light); color: var(--blue); }
  .auth-msg { display: none; padding: 12px 14px; border-radius: 10px; font-size: 13px; font-weight: 600; margin-bottom: 16px; }
  .auth-msg.error { display: block; background: #fdeceb; color: #b3261e; }
  .auth-msg.success { display: block; background: #e6f7f1; color: #0a7c4e; }
  .back-home { display: inline-flex; align-items: center; gap: 6px; color: rgba(255,255,255,0.7); font-size: 14px; margin-bottom: 24px; }
</style>
</head>
<body>
  <div class="auth-wrap">
    <a href="index.html" class="back-home"><i class="fas fa-arrow-left"></i> Back to site</a>
    <div class="auth-card">
      <div style="text-align:center;margin-bottom:24px;">
        <span class="logo-icon" style="color:var(--gold);font-size:28px;"><i class="fas fa-globe-africa"></i></span>
        <h2 style="color:var(--navy);margin-top:8px;">Portal Access</h2>
        <p style="color:var(--text-muted);font-size:14px;">Job seekers, employers & staff</p>
      </div>

      <div class="auth-tabs">
        <div class="auth-tab active" id="tabLogin">Log In</div>
        <div class="auth-tab" id="tabSignup">Sign Up</div>
      </div>

      <div id="authMsg" class="auth-msg"></div>

      <!-- LOGIN FORM -->
      <form class="auth-form active" id="loginForm">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="loginEmail" required />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="loginPassword" required />
        </div>
        <button type="submit" class="btn btn-primary btn-full" id="loginBtn">Log In</button>
      </form>

      <!-- SIGNUP FORM -->
      <form class="auth-form" id="signupForm">
        <label style="font-size:13px;font-weight:600;color:var(--text);display:block;margin-bottom:8px;">I am a...</label>
        <div class="role-select">
          <div class="role-option selected" data-role="job_seeker"><i class="fas fa-user" style="display:block;margin-bottom:6px;"></i>Job Seeker</div>
          <div class="role-option" data-role="employer"><i class="fas fa-building" style="display:block;margin-bottom:6px;"></i>Employer</div>
        </div>
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="signupName" required />
        </div>
        <div class="form-group" id="companyGroup" style="display:none;">
          <label>Company Name</label>
          <input type="text" id="signupCompany" />
        </div>
        <div class="form-group">
          <label>Phone</label>
          <input type="tel" id="signupPhone" placeholder="+254 7XX XXX XXX" />
        </div>
        <div class="form-group">
          <label>Current Country</label>
          <select id="signupCountry" required>
            <option value="">Select your country...</option>
            <option value="Kenya" selected>Kenya</option>
            <option value="Uganda">Uganda</option>
            <option value="Tanzania">Tanzania</option>
            <option value="Rwanda">Rwanda</option>
            <option value="Ethiopia">Ethiopia</option>
            <option value="Nigeria">Nigeria</option>
            <option value="Ghana">Ghana</option>
            <option value="South Africa">South Africa</option>
            <option value="Egypt">Egypt</option>
            <option value="UAE">United Arab Emirates</option>
            <option value="Saudi Arabia">Saudi Arabia</option>
            <option value="Qatar">Qatar</option>
            <option value="Kuwait">Kuwait</option>
            <option value="Bahrain">Bahrain</option>
            <option value="United Kingdom">United Kingdom</option>
            <option value="Germany">Germany</option>
            <option value="Canada">Canada</option>
            <option value="United States">United States</option>
            <option value="Other">Other</option>
          </select>
        </div>
        <div class="form-group" id="jobSeekerOnlyGroup">
          <label>Highest Level of Education</label>
          <select id="signupEducation">
            <option value="">Select...</option>
            <option value="Primary">Primary School</option>
            <option value="Secondary">Secondary School</option>
            <option value="Certificate">Certificate</option>
            <option value="Diploma">Diploma</option>
            <option value="Bachelor's Degree">Bachelor's Degree</option>
            <option value="Master's Degree">Master's Degree</option>
            <option value="PhD">PhD / Doctorate</option>
          </select>
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="signupEmail" required />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="signupPassword" required minlength="6" />
        </div>
        <div class="form-group" style="display:flex;align-items:flex-start;gap:10px;">
          <input type="checkbox" id="signupPrivacy" required style="margin-top:3px;width:16px;height:16px;flex-shrink:0;" />
          <label for="signupPrivacy" style="font-weight:400;font-size:13px;color:var(--text-muted);">
            I agree to the <a href="privacy.html" target="_blank" style="color:var(--blue);font-weight:600;">Privacy Policy</a> and consent to my data being used to match me with job opportunities.
          </label>
        </div>
        <button type="submit" class="btn btn-primary btn-full" id="signupBtn">Create Account</button>
        <p class="form-note">Employer accounts require admin approval before candidate access is unlocked.</p>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="supabase-config.js"></script>
  <script src="auth.js"></script>
</body>
</html>
